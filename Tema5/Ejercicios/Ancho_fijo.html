<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 - Ancho Fijo</title>
    <style>
        /* Contenedor con ancho fijo y centrado horizontalmente */
        .contenedor-fijo {
            width: 800px;
            margin: 0 auto; /* Centra el bloque en la pantalla */
            border: 1px solid #ccc;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div class="contenedor-fijo">
        <header>
            <h1 align="center">Página de Ancho Fijo</h1>
        </header>
        <main>
            <p>Este contenido está confinado estrictamente a un ancho de <strong>800 píxeles</strong>. Si la pantalla es más grande, verás espacios vacíos a los lados; si es más pequeña, aparecerá una barra de desplazamiento horizontal.</p>
        </main>
        <footer>
            <p align="center">&copy; 2026 - Diseño Web</p>
        </footer>
    </div>

</body>
</html>
