<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5 - Ancho Variable</title>
    <style>
        /* Contenedor con ancho variable / líquido */
        .contenedor-variable {
            width: 85%;       /* Ocupa el 85% del ancho de la ventana */
            max-width: 1200px;/* Opcional: evita que en pantallas gigantes se estire demasiado */
            margin: 0 auto;   <-- Centrado fluido -->
            padding: 20px;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div class="contenedor-variable">
        <header>
            <h1 align="center">Página de Ancho Variable (Fluido)</h1>
        </header>
        <main>
            <p>Este diseño se adapta de forma fluida al cambiar el tamaño del navegador, eliminando los molestos espacios muertos excesivos y evitando el scroll horizontal en pantallas medianas.</p>
        </main>
        <footer>
            <p align="center">&copy; 2026 - Diseño Web</p>
        </footer>
    </div>

</body>
</html>
